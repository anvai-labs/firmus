name: CI

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI_REF: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

jobs:
  authorize-owner-private:
    name: Authorize owner private CI
    if: >-
      github.event_name == 'pull_request_target' &&
      github.actor_id == '5168752' &&
      github.event.pull_request.user.id == 5168752 &&
      github.event.pull_request.head.repo.full_name == github.repository
    environment: owner-private-ci
    runs-on: [self-hosted, Linux, X64, public-overflow]
    timeout-minutes: 5
    steps:
      - name: Verify isolated runner assignment
        run: |
          test "${RUNNER_ENVIRONMENT}" = "self-hosted"
          test "${GITHUB_EVENT_NAME}" = "pull_request_target"

  test:
    name: Tests and coverage
    needs: authorize-owner-private
    if: >-
      always() && (
        github.event_name != 'pull_request_target' ||
        github.actor_id != '5168752' ||
        github.event.pull_request.user.id != 5168752 ||
        github.event.pull_request.head.repo.full_name != github.repository ||
        needs.authorize-owner-private.result == 'success'
      )
    runs-on: ${{ github.event_name == 'pull_request_target' && github.actor_id == '5168752' && github.event.pull_request.user.id == 5168752 && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","Linux","X64","public-overflow"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CI_REF }}
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install coverage
        run: python -m pip install --disable-pip-version-check coverage==7.10.6

      - name: Compile Python sources
        run: python -m compileall -q remote_filesystem_research.py tests

      - name: Run tests with coverage gate
        run: |
          coverage run --branch --source=remote_filesystem_research -m unittest discover -s tests -v
          coverage report --show-missing --fail-under=30

  ci-success:
    name: CI Success
    needs: [authorize-owner-private, test]
    if: >-
      always() && (
        github.event_name != 'pull_request_target' ||
        github.actor_id != '5168752' ||
        github.event.pull_request.user.id != 5168752 ||
        github.event.pull_request.head.repo.full_name != github.repository ||
        needs.authorize-owner-private.result == 'success'
      )
    runs-on: ${{ github.event_name == 'pull_request_target' && github.actor_id == '5168752' && github.event.pull_request.user.id == 5168752 && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","Linux","X64","public-overflow"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Require successful tests
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "${TEST_RESULT}" = "success"
